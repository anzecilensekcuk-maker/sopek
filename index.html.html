function size(){

function loop(ts){

function spawn(n){
  for(var i=0;i<n;i++)FL.push({x:3+Math.random()*(COLS-6),y:-3-Math.random()*22,v:12+Math.random()*9,ph:Math.random()*6.28,k:(Math.random()*4)|0});
